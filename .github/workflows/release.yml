name: Release

# Builds Windows, macOS and Linux apps and publishes them as a GitHub Release, together with the
# latest*.yml / .blockmap files the in-app updater reads. Either:
#   - push a tag like v1.2.0, or
#   - run this workflow manually (Actions → Release → Run workflow); it tags the current commit
#     as v<version from package.json> and publishes that release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, script: dist:win,   files: "release/NeoMarkdownReader-*-Setup.exe\nrelease/NeoMarkdownReader-*-Setup.exe.blockmap\nrelease/NeoMarkdownReader-*-Portable.exe\nrelease/latest.yml" }
          - { name: macos,   os: macos-latest,   script: dist:mac,   files: 'release/*.dmg' }
          - { name: linux,   os: ubuntu-latest,  script: dist:linux, files: "release/*.AppImage\nrelease/latest-linux.yml" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Neo Markdown Reader ${{ steps.tag.outputs.name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
