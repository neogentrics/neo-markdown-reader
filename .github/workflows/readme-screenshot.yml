# Temporary: captures File Explorer showing a Markdown file in its Preview pane, for the README.
name: README screenshot (Explorer preview)
on:
  push:
    branches: [claude/readme-screenshots]
jobs:
  explorer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - run: npm run build:preview
      - name: Show a document in Explorer's Preview pane and capture the screen
        shell: powershell
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File preview/explorer-screenshot.ps1 -Dll preview-dist/NeoMarkdownPreviewShim.dll -Out shots
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: explorer-shots, path: shots }
