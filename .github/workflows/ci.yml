name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: File Explorer preview — renderer tests
        run: npm run test:preview
      - name: File Explorer preview — build, register and preview a document like Explorer does
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          npm run build:preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File preview/ci-check.ps1 -Dll preview-dist/NeoMarkdownPreview.dll -Register
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: End-to-end test (real app)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: End-to-end test (real app, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

  package-windows:
    name: Package Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install silently and check the File Explorer preview registration
        shell: powershell
        run: |
          $setup = Get-ChildItem release/RTMarkdownReader-*-Setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File preview/ci-check.ps1 -Installed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\neo-markdown-reader'
          if (-not (Test-Path $dir)) { $dir = Join-Path $env:LOCALAPPDATA 'Programs\RT Markdown Reader' }
          $un = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $un.FullName -ArgumentList '/S', "_?=$dir"
          powershell -NoProfile -File preview/ci-check.ps1 -Uninstalled
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Update from the last version with the old name, keeping the install and its data
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v3.3.0 -R neogentrics/neo-markdown-reader -p 'NeoMarkdownReader-3.3.0-Setup.exe' -D old-release
          Start-Process -Wait -FilePath (Resolve-Path old-release/NeoMarkdownReader-3.3.0-Setup.exe) -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\neo-markdown-reader'
          if (-not (Test-Path (Join-Path $dir 'Neo Markdown Reader.exe'))) { throw 'The old version did not install.' }
          $data = Join-Path $env:APPDATA 'Neo Markdown Reader'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'settings.json') '{"theme":"sepia"}'
          $setup = Get-ChildItem release/RTMarkdownReader-*-Setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S', '--updated'
          if (-not (Test-Path (Join-Path $dir 'RT Markdown Reader.exe'))) { throw 'The new version is not in the same folder.' }
          if (Test-Path (Join-Path $dir 'Neo Markdown Reader.exe')) { throw 'The old program was left behind.' }
          $entries = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like '*Markdown Reader*'
          if (@($entries).Count -ne 1 -or $entries.DisplayName -notlike 'RT Markdown Reader*') { throw "Add/Remove Programs shows: $($entries.DisplayName -join ', ')" }
          $links = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*Markdown Reader*.lnk' | Select-Object -ExpandProperty Name
          if ($links -notcontains 'RT Markdown Reader.lnk' -or $links -contains 'Neo Markdown Reader.lnk') { throw "Start menu shows: $($links -join ', ')" }
          if ((Get-Content (Join-Path $data 'settings.json') -Raw) -notmatch 'sepia') { throw 'Settings were lost.' }
          $un = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $un.FullName -ArgumentList '/S', "_?=$dir"
      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v7
        with:
          name: RTMarkdownReader-windows-${{ github.sha }}
          path: |
            release/RTMarkdownReader-*-Setup.exe
            release/RTMarkdownReader-*-Portable.exe
          retention-days: 14
